name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $name = "streamdek-$version-windows"
          New-Item -ItemType Directory -Path "release/$name/scripts" -Force | Out-Null
          Copy-Item -Recurse dist "release/$name/dist"
          Copy-Item README.md, CHANGELOG.md, package.json, package-lock.json "release/$name/"
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1 "release/$name/scripts/"
          Compress-Archive -Path "release/$name" -DestinationPath "release/$name.zip"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="streamdek-$version-$PLATFORM"
          mkdir -p "release/$name/scripts"
          cp -R dist "release/$name/dist"
          cp README.md CHANGELOG.md package.json package-lock.json "release/$name/"
          if [ "$PLATFORM" = "macos" ]; then
            cp scripts/install-macos.sh scripts/uninstall-macos.sh "release/$name/scripts/"
            chmod +x "release/$name/scripts/"*.sh
          else
            cp scripts/install-linux.sh scripts/uninstall-linux.sh scripts/50-elgato-stream-deck-user.rules "release/$name/scripts/"
            chmod +x "release/$name/scripts/"*.sh
          fi
          tar -czf "release/$name.tar.gz" -C release "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum streamdek-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Streamdek $GITHUB_REF_NAME" \
            --notes "Requires Node.js 24 or newer. Download the archive for your operating system, extract it, and run the included installer."
