name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to use for packaging validation
        required: true
        default: 1.4.0

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        run: npx electron-builder --win dir --x64

      - name: Build macOS desktop app
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dir --${{ matrix.arch }}

      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        run: npx electron-builder --linux dir --${{ matrix.arch }}

      - name: Stage Windows payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/payload/scripts -Force | Out-Null
          Copy-Item -Recurse release/electron/win-unpacked/* release/payload/
          Copy-Item README.md, CHANGELOG.md release/payload/
          Copy-Item scripts/uninstall.ps1, scripts/register-windows-task.ps1, scripts/watch-windows.ps1 release/payload/scripts/

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ env.RELEASE_VERSION }}'.TrimStart('v')
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup compiler was not found on the runner.'
          }
          & $iscc "/DAppVersion=$version" "/DPayloadDir=$((Resolve-Path release/payload).Path)" "/DOutputDir=$((Resolve-Path release).Path)" "/DOutputBaseFilename=streamdek-$version-windows-x64-setup" packaging/windows/streamdek.iss

      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          root="release/pkg-root"
          app_dir="$root/Library/Application Support/Streamdek"
          app_bundle=$(find release/electron -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_bundle"
          mkdir -p "$app_dir" "$root/Library/LaunchAgents" "$root/Applications"
          cp -R "$app_bundle" "$root/Applications/Streamdek.app"
          cp packaging/macos/uninstall.sh "$app_dir/"
          chmod 0755 "$app_dir/uninstall.sh"
          cp packaging/macos/com.jetcar.streamdek.plist "$root/Library/LaunchAgents/"
          pkgbuild \
            --root "$root" \
            --scripts packaging/macos/scripts \
            --identifier com.jetcar.streamdek \
            --version "$version" \
            --install-location / \
            "release/streamdek-$version-macos-$ARCH.pkg"
          pkgutil --check-signature "release/streamdek-$version-macos-$ARCH.pkg" || true
          pkgutil --payload-files "release/streamdek-$version-macos-$ARCH.pkg" | grep -q 'Applications/Streamdek.app/Contents/MacOS/Streamdek'

      - name: Build Linux installer
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          root="release/deb-root"
          app_dir=$(find release/electron -maxdepth 1 -type d -name 'linux*-unpacked' -print -quit)
          test -n "$app_dir"
          mkdir -p "$root/DEBIAN" "$root/opt/streamdek" "$root/usr/lib/systemd/user" "$root/usr/lib/udev/rules.d" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/512x512/apps"
          cp -R "$app_dir"/. "$root/opt/streamdek/"
          cp packaging/linux/streamdek.service "$root/usr/lib/systemd/user/"
          cp packaging/linux/streamdek.desktop "$root/usr/share/applications/"
          cp assets/tray-icon.png "$root/usr/share/icons/hicolor/512x512/apps/streamdek.png"
          cp scripts/50-elgato-stream-deck-user.rules "$root/usr/lib/udev/rules.d/"
          cp packaging/linux/postinst packaging/linux/prerm packaging/linux/postrm "$root/DEBIAN/"
          chmod 0755 "$root/DEBIAN/postinst" "$root/DEBIAN/prerm" "$root/DEBIAN/postrm"
          installed_size=$(du -sk "$root" | cut -f1)
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@ARCH@/$(dpkg --print-architecture)/g" \
            -e "s/@INSTALLED_SIZE@/$installed_size/g" \
            packaging/linux/control > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "release/streamdek-$version-linux-$ARCH.deb"
          dpkg-deb --info "release/streamdek-$version-linux-$ARCH.deb"
          dpkg-deb --contents "release/streamdek-$version-linux-$ARCH.deb" > release/deb-contents.txt
          grep -q './opt/streamdek/streamdek' release/deb-contents.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.pkg
            release/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Restore Android signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks
      - name: Build signed Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          version="${RELEASE_VERSION#v}"
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/streamdek-$version-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum streamdek-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Streamdek $GITHUB_REF_NAME" \
            --notes "Desktop installers include the Streamdek tray application and production dependencies. The Android APK is signed and installable. Desktop packages are currently unsigned."
